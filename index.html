<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para el amor de mi vida ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, #ffdde6, #fff5f8, #ffd1dc);
            color: #5a1830;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .corazones {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .corazon {
            position: absolute;
            color: rgba(214, 40, 90, 0.25);
            font-size: 25px;
            animation: flotar 8s linear infinite;
        }

        .corazon:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .corazon:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }

        .corazon:nth-child(3) {
            left: 45%;
            animation-delay: 4s;
        }

        .corazon:nth-child(4) {
            left: 65%;
            animation-delay: 1s;
        }

        .corazon:nth-child(5) {
            left: 85%;
            animation-delay: 3s;
        }

        @keyframes flotar {
            0% {
                transform: translateY(110vh) scale(0.8);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-20vh) scale(1.3);
                opacity: 0;
            }
        }

            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 900px;
            margin: auto;
            padding: 35px 0;
        }

        .tarjeta {
            background: rgba(255, 255, 255, 0.90);
            border-radius: 30px;
            padding: 35px 25px;
