<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para el amor de mi vida ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Georgia,serif;
  color:white;
  background:
    radial-gradient(circle at top,#ffb6c9 0%,transparent 35%),
    linear-gradient(135deg,#5b1835,#b52b58,#ff8fa8);
  padding:20px 12px 50px;
}

.card{
  max-width:760px;
  margin:auto;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.3);
  border-radius:28px;
  padding:25px 18px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
  backdrop-filter:blur(8px);
}

h1{
  font-size:34px;
  margin:5px 0 10px;
}

h2{
  margin-top:30px;
}

.heart{
  font-size:48px;
  animation:latido 1.2s infinite;
}

@keyframes latido{
  50%{transform:scale(1.18)}
}

.subtitle{
  font-size:18px;
  opacity:.95;
}

.photos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:25px 0;
}

.photos img{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:20px;
  border:2px solid rgba(255,255,255,.6);
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.box{
  margin:20px 0;
  padding:18px 10px;
  border-radius:22px;
  background:rgba(0,0,0,.18);
}

.counter{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:12px;
}

.number{
  font-size:25px;
  font-weight:bold;
}

.label{
  font-size:11px;
  opacity:.85;
}

.letter{
  text-align:left;
  line-height:1.7;
  font-size:17px;
}

.music{
